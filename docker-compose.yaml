version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: doctors-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-doctors_appointment}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctors-backend
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./.env.example
    ports:
      - "3001:3001"
    environment:
      PORT: ${PORT:-3001}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/doctors_appointment}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      NODE_ENV: ${NODE_ENV:-production}

volumes:
  mongo_data:
